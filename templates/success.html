<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Consultation Confirmed - Full Stack Digital Solutions</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Full Stack Development Services is a tech company providing
            website, web app and stand-alone app solutions for your company's needs.">
        <meta name="keywords" content="full stack development, web development, app development, 
            website solutions, web app solutions, stand-alone app solutions, tech company, software development,
            programming services">
        <meta name="robots" content="nofollow">
        <meta name="pragma" content="no-cache">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" 
            rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://js.stripe.com/v3/"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="{{ url_for('static', filename='dev_services.css') }}">
        <script defer src="{{ url_for('static', filename='script.js') }}"></script>
    </head>
    <body id="main_pages">
        <header>
            <img src="{{ url_for('static', filename='images/fullstack_DSDA_logo3.gif') }}" class="figure-img img-fluid mx-auto d-block hidden-left" style="width: 300px;">

            <ul class="nav justify-content-center mt-5 gap-3 hidden-left">
                <li class="nav-item">
                    <a href="definition.html" class="nav-link text-decoration-none bg-black bg-opacity-75 hidden-left">{Home}</a>
                </li>
                <li class="nav-item">
                    <a href="websites.html" class="nav-link text-decoration-none bg-black bg-opacity-75">{Website Services}</a>
                </li>
                <li class="nav-item">
                    <a href="apps.html" class="nav-link text-decoration-none bg-black bg-opacity-75 hidden-left">{Application Development}</a>
                </li>
                <li class="nav-item">
                    <a href="creative_labs.html" class="nav-link text-decoration-none bg-black bg-opacity-75 hidden-left">{Creative Labs}</a>
                </li>
                <li class="nav-item">
                    <a href="/book_consult.html" class="nav-link text-decoration-none bg-black bg-opacity-75 hidden-left">{Book Consultation}</a>
                </li>
            </ul>
        </header>

        <div class="container mt-5" style="overflow-x: hidden;">
            <div class="row justify-content-center">
                <div class="col-xl-6 hidden-left">
                    <div class="bg-black bg-opacity-75 p-5 text-center border border-success rounded hidden-left">
                        <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                        <h1 class="text-white fw-bold mt-3">Payment Successful</h1>
                        <h3 class="text-light mt-4">Thank you, {{ first_name }}!</h3>
                        <p class="text-white fs-5 mt-3">
                            Your consultation is confirmed for <br>
                            <span class="fw-bold text-success">{{ date }}</span> at <span class="fw-bold text-success">{{ time }}</span>.
                        </p>
                        <p class="text-secondary mt-4">A receipt has been sent to your email.</p>
                        <a href="/book_consult" class="btn btn-outline-light mt-3">Return to Booking</a>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
